name: Manual Stable Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Numeric fork version (e.g. 26.10.1002)'
        required: true

jobs:
  build_and_release:
    name: Verify and Build Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Accept the terms of use to suppress the caching licensing warning
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          # Cache is read-only for manual stable releases
          cache-read-only: true

      - name: Install required Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate release version
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          [[ "$VERSION_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          ! git rev-parse --verify "refs/tags/$VERSION_TAG"

      - name: Setup Signing Keys
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_STORE_BASE64:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ]; then
            echo "ERROR: Persistent fork release signing secrets are required"
            exit 1
          fi
          mkdir -p keystore
          echo "${SIGNING_KEY_STORE_BASE64}" | base64 --decode > keystore/carlyu.jks
          echo "storeFile=keystore/carlyu.jks" > keystore.properties
          echo "keyAlias=${SIGNING_KEY_ALIAS}" >> keystore.properties
          echo "keyPassword=${SIGNING_KEY_PASSWORD}" >> keystore.properties
          echo "storePassword=${SIGNING_STORE_PASSWORD}" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Stable Release APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: ./gradlew spotlessCheck testUnstableDebugUnitTest assemblePreviewDebug assembleStableRelease -PVERSION_NAME="$VERSION_TAG"

      - name: Find and Rename Universal APKs
        id: rename_apk
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          PROJECT_NAME="InstallerX-Resigned"
          
          APK_DIR=$(find app/build/outputs/apk -type d | grep -iE '/stable/release$' | head -n 1)
          if [ -z "$APK_DIR" ]; then
            echo "ERROR: Stable APK output directory not found"
            ls -R app/build/outputs/apk
            exit 1
          fi
          ORIGINAL_APK=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$ORIGINAL_APK" ]; then
            echo "ERROR: Stable APK not found in $APK_DIR!"
            ls -R app/build/outputs/apk
            exit 1
          fi

          NEW_APK_NAME="${PROJECT_NAME}-online-${VERSION_TAG}.apk"
          NEW_APK_PATH="${APK_DIR}/${NEW_APK_NAME}"

          echo "Renaming $ORIGINAL_APK -> $NEW_APK_PATH"
          mv "$ORIGINAL_APK" "$NEW_APK_PATH"
          echo "apk=${NEW_APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify signed fork artifact
        env:
          EXPECTED_CERT: ${{ vars.SIGNING_CERT_SHA256 }}
          VERSION_TAG: ${{ inputs.version_tag }}
          APK: ${{ steps.rename_apk.outputs.apk }}
        run: |
          test -n "$EXPECTED_CERT"
          TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          ACTUAL_CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' signature.txt | sort -u)
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$TOOLS/aapt2" dump badging "$APK" | sed -n '1p' | tee package.txt
          grep -F "name='com.darkaxt.installerx.resign'" package.txt
          grep -F "versionName='$VERSION_TAG'" package.txt
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "InstallerX Resigned ${{ inputs.version_tag }}"
          # Use the exact input as the tag name
          tag_name: ${{ inputs.version_tag }}
          target_commitish: ${{ github.sha }}
          # Publish as draft so you can manually write the changelog and publish it later
          draft: true
          prerelease: false
          # Explicitly prevent GitHub from auto-generating release notes in the body
          generate_release_notes: false
          files: |
            ${{ steps.rename_apk.outputs.apk }}
            app/build/outputs/apk/Stable/release/SHA256SUMS.txt
